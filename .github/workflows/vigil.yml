# This repository's caller for the centrally maintained Vigil workflow.
# Other F2iLLC repositories can use the same stub with:
#   uses: F2iLLC/vigil/.github/workflows/reusable-vigil.yml@main

name: Vigil PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  vigil:
    # STATUS (recorded 2026-09-27, F2iLLC/vigil#90; #69 closed with this
    # undone):
    #   * GitHub state: the "Vigil PR Review" workflow has been
    #     `disabled_manually` since its last run on 2026-03-14. The reason for
    #     that March disablement was never recorded anywhere and remains
    #     unrecorded — do not assume one.
    #   * VIGIL_SKIP=true has been set on all five F2iLLC repositories (vigil,
    #     LunaOS, bioqms-core, relara, praxislms) since 2026-09-10 for cost
    #     control: the shared org Gemini API / Actions budget was exhausted in
    #     early September 2026 (owner decision, recorded in #90).
    #   * Preconditions before anyone re-enables it (#90 / #88 triage):
    #     (a) reusable-vigil.yml pins the action at SHA ce4df1c…, 15 commits
    #         behind main (#88) — re-enabling would self-review with a stale
    #         reviewer until #88 is ruled;
    #     (b) the `ci-general` self-hosted runner label targeted by
    #         runner-json has not been verified online; with no such runner,
    #         jobs queue indefinitely rather than failing.
    #   * Re-enabling (here or via VIGIL_SKIP) is an owner decision.
    #
    # KILL SWITCH: set the Actions variable VIGIL_SKIP=true (`gh variable set
    # VIGIL_SKIP -b true`) to skip Vigil on this repo without editing the
    # workflow; unset it to resume. The reusable workflow's checks are not
    # required status checks, so skipping them blocks nothing, but any required
    # approval must then come from a human reviewer.
    if: vars.VIGIL_SKIP != 'true'
    uses: ./.github/workflows/reusable-vigil.yml
    with:
      runner-json: '["self-hosted","linux","x64","ci-general"]'
    secrets: inherit
