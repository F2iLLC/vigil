# This repository's caller for the centrally maintained Vigil workflow.
# Other F2iLLC repositories can use the same stub with:
#   uses: F2iLLC/vigil/.github/workflows/reusable-vigil.yml@main

name: Vigil PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Dependabot reviews use the base-branch context so Actions secrets are available.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  vigil:
    # STATUS (F2iLLC/vigil#90; #69 closed with this undone)
    #
    # History (recorded 2026-09-27, superseded — see "Current state" below):
    #   * GitHub state then: the "Vigil PR Review" workflow had been
    #     `disabled_manually` since its last run on 2026-03-14. The reason for
    #     that March disablement was never recorded anywhere and remains
    #     unrecorded — do not assume one.
    #   * VIGIL_SKIP=true was recorded as set on all five F2iLLC repositories
    #     (vigil, LunaOS, bioqms-core, relara, praxislms) since 2026-09-10 for
    #     cost control: the shared org Gemini API / Actions budget was
    #     exhausted in early September 2026 (owner decision, recorded in #90).
    #   * Preconditions then listed before re-enabling (#90 / #88 triage):
    #     (a) reusable-vigil.yml pinned the action at a SHA behind main (#88);
    #     (b) the `ci-general` self-hosted runner label targeted by
    #         runner-json had not been verified online.
    #   * Re-enabling (here or via VIGIL_SKIP) was an owner decision.
    #
    # Current state (observed 2026-11-20):
    #   * The "Vigil PR Review" workflow (id 245348900) is `active`.
    #   * This repository has no Actions variables defined, so VIGIL_SKIP is
    #     unset here.
    #   * When, why, and by whom the workflow was re-enabled is not recorded
    #     in-tree; do not assume a reason, date, or actor.
    #   * reusable-vigil.yml still pins F2iLLC/vigil at a commit SHA; the
    #     pin-tracking rule (@v1 vs SHA) is still undecided in #88.
    #   * Precondition (b) no longer applies: runner-json below is
    #     ["ubuntu-latest"].
    #   * Making this a required status check on main (#90 ask 2) is still an
    #     open owner decision.
    #
    # KILL SWITCH: set the Actions variable VIGIL_SKIP=true (`gh variable set
    # VIGIL_SKIP -b true`) to skip Vigil on this repo without editing the
    # workflow; unset it to resume. The reusable workflow's checks are not
    # required status checks, so skipping them blocks nothing, but any required
    # approval must then come from a human reviewer.
    if: vars.VIGIL_SKIP != 'true'
    uses: ./.github/workflows/reusable-vigil.yml
    with:
      model: openai/gpt-6-luna
      runner-json: '["ubuntu-latest"]' # public repo: never self-hosted (a fork PR could run code on our servers). Private repos use ci-light.
    secrets: inherit
