# Detect release-pin drift (issues #58, #82). REPORT ONLY — never mutates a tag.
#
# The release decision is the owner's, so this workflow does not ship anything.
# What it removes is the *silence*: the drift in issue #58 was found four times
# by a human reading SHAs by hand, and each time it had already been live for
# hours.
#
# WHAT WENT WRONG WITH THE FIRST VERSION OF THIS FILE (#82)
# ---------------------------------------------------------
# It ran 26 times between 2026-08-12 and 2026-08-30 and failed 26 times, and it
# never once reported a drift. Two independent defects, both fixed here:
#
#  1. IT WAS MUTE. GitHub's default `run` shell is
#     `bash --noprofile --norc -e -o pipefail {0}`. A step body that opens with
#     `set -uo pipefail` does NOT clear that inherited `-e`, so
#
#         out="$(bash .github/scripts/tagctl.sh drift ...)"; rc=$?
#
#     killed the step the instant `tagctl.sh` exited non-zero — which is
#     precisely and only the case the reporting code underneath was written to
#     handle. Every drift branch was unreachable; a drifted run produced a bare
#     `Process completed with exit code 3` and nothing else. The steps now
#     declare `shell: bash {0}` and also guard the substitution with `|| rc=$?`,
#     so neither the flag nor the guard is load-bearing alone.
#
#  2. IT WAS PERMANENTLY RED, SO IT CARRIED NO SIGNAL. One job covered both
#     surfaces. A `F2iLLC/vigil@<sha>` self-pin goes stale the moment any commit
#     lands after it is bumped, so that surface is red in the steady state — and
#     it masked the alias surface completely. The check was red from the day it
#     was created, which is why the 21-hour #79/#80 drift was indistinguishable
#     from background noise. The two surfaces are now independent jobs, so
#     `v1 alias vs main` is genuinely green when the fleet is current.
#
#  3. IT WAS STILL PERMANENTLY RED ONE LEVEL UP (#89). Splitting the surfaces
#     fixed the *job* signal but not the one people actually look at: GitHub
#     rolls a run's conclusion up from its jobs, so a red `self-pins vs main`
#     still paints the whole `Tag drift check` run red. The run conclusion has
#     been `failure` on 12 of 12 runs. Only 3 of those postdate the split: two
#     were genuinely red because `v1` really was behind (#82), and one — run
#     33503843618 — had `v1 alias vs main` GREEN and was still reported
#     `failure`. So since the split, every run in which the fleet was actually
#     healthy (1 of 1) has still been reported red. That is defect 2's alert
#     fatigue reproduced at the run level, and it trains people to ignore the
#     one check that reports real release drift.
#
#     And as currently wired the gate is unsatisfiable, so it is a broken gate
#     rather than a policy anyone is failing to honour. `cmd_pins` decides
#     "current" with an EXACT equality against `origin/main`'s head, and
#     writing a new pin SHA into a workflow file *is itself a commit on main* —
#     so a pin expressed as a commit SHA is one behind the very head its own
#     bump created. Verified experimentally: bump a SHA self-pin to the
#     then-current head, commit that bump, and `pins` reports
#     `behind:1 / status=stale / exit 3` immediately. All three real self-pins
#     (`reusable-vigil.yml`, `ce4df1c…`) are SHA pins, so no sequence of bumps
#     can make this job green while they stay SHAs.
#
#     Note the limit of that claim: the check itself is not broken. A pin
#     written as a moving ref — `F2iLLC/vigil@v1` — resolves to the alias and
#     IS reported current whenever the alias is at main, which is covered by
#     `test_pins_reports_all_current_when_the_pin_is_at_head`. Expressing the
#     self-pins as `@v1`, so this repo tracks the alias the way its consumers
#     do, is one of the options #88 is deciding.
#
#     So surface 2 is now REPORT ONLY. It emits the same annotation and the
#     same pin table and cannot fail. Surface 1 keeps its `exit 1` and is the
#     single gating surface: the run still goes red on genuine alias drift,
#     which is the only drift that means merged fixes are not reaching
#     consumers. This removes the false red without pre-empting #88 — neither
#     the equality test in `tagctl.sh` nor the pin style is changed here.
#
# WHY IT ALSO FILES AN ISSUE
# --------------------------
# A red scheduled workflow is demonstrably not enough: 26 of them were ignored.
# #82's actual complaint is that the drift is invisible *in the issue tracker* —
# each recurrence left a CLOSED defect still live across five repos, so anyone
# asking "is #79 fixed?" got "yes" while the vulnerable reviewer was still
# gating every PR in the fleet. So drift also opens a single deduplicated
# tracking issue, refreshes it while the gap persists, and closes it by itself
# once the alias catches up.
#
# The tracker deliberately watches ONLY the `v1` alias. The self-pins are stale
# by construction between bumps; tracking them here would leave an issue open
# permanently and recreate the exact saturation this file is fixing.
#
# THE THIRD DEFECT: THE TRACKER DID NOT NOTICE THE FIX (#82 again)
# ----------------------------------------------------------------
# Adding the tracking issue above closed one hole and opened another. This
# workflow's original triggers were `push: branches: [main]`, a daily cron and
# `workflow_dispatch` — and *moving the alias fires none of them*. Moving `v1`
# is a tag push, not a push to `main`.
#
# So the control was wrong in the ALARMING direction for up to a full cron
# period after every release: the tracking issue kept asserting drift that had
# already been cleared. Observed on 2026-09-01:
#
#     33466335330  2026-09-01T03:28:21Z  Release (move major alias tag)  success
#     33399777004  2026-08-31T13:56:51Z  Tag drift check   schedule      failure
#
# The release moved `v1` to `dfba3d0` (== `origin/main`) at 03:28Z. The drift
# check's most recent run was from 13:56Z the *previous day*, and issue #85 sat
# open past it, still saying "1 commit behind". That is not a harmless
# inaccuracy. Defect 2 above is the record of what happens to a check that
# cries wolf: 26 red runs, all ignored, and a real 21-hour drift lost in the
# noise. A tracker that stays red after the problem is fixed teaches people to
# stop reading it, which is the same failure with extra steps.
#
# WHY TWO NEW TRIGGERS, AND WHY NEITHER IS REDUNDANT
# ---------------------------------------------------
# The alias can move down two different paths, and each new trigger covers
# exactly one of them:
#
#  * `workflow_run` on **Release (move major alias tag)** — the automated path.
#    When `release.yml`'s `publish` job force-pushes `refs/tags/v1` it does so
#    with the default `GITHUB_TOKEN`, and GitHub deliberately does not start
#    new workflow runs from events created with that token. So that tag push
#    created NO workflow run at all — which is exactly why a `push: tags:`
#    trigger ALONE would not have caught the 03:28Z release above.
#    `workflow_run` is the only trigger that can see the automated path.
#
#  * `push:` on the alias tag pattern — the human path. The 2026-08-30 and
#    2026-08-31 alias moves were made by hand with a plain `git push`, which
#    carries a human credential and therefore does start workflow runs.
#    `workflow_run` cannot see those, because no release workflow ran.
#
# Both, therefore; dropping either one reopens a real hole. `types:
# [completed]` rather than a success filter: a release that fails *after*
# `publish` has already pushed the tag has still moved the alias, and
# re-deriving the answer costs one runner-minute and cannot be wrong, so there
# is no reason to be selective about it.
#
# This stays REPORT-ONLY under both new triggers. The `alias` job holds
# `contents: read` + `issues: write` and has no step that pushes anything: it
# reacts to a release, it does not perform one.

name: Tag drift check

on:
  push:
    branches: [main]
    tags:
      # ALIAS TAGS ONLY — this list must never match a semver tag.
      #
      # `release.yml` triggers on `v[0-9]+.[0-9]+.[0-9]+`. If this workflow
      # also fired on the semver push it would start BEFORE `release.yml` had
      # moved the alias, report drift that is about to be cleared, refresh the
      # tracking issue with it, and then never re-run once the alias landed —
      # strictly worse than the daily cron it is meant to improve on.
      #
      # These are GitHub filter patterns, NOT regexes. Per the filter-pattern
      # cheat sheet, `[]` "matches one alphanumeric character listed in the
      # brackets or included in ranges" (`[1-2]00` matches `100` and `200`),
      # and `+` "matches one or more of the PRECEDING CHARACTER". A bracket
      # range is not a character, so `v[0-9]+` is ambiguous at best: on the
      # literal reading it is `v`, one digit, then a `+` sign. Rather than bet
      # the correctness of a monitoring control on that ambiguity, spell the
      # widths out. Each pattern below is a fixed number of single-character
      # classes, so none of them can match a `.` under any reading — `v1.2.0`
      # is unmatchable by construction rather than by intent.
      #
      # Covers v0..v99. Add `v[0-9][0-9][0-9]` if this repo ever ships a
      # three-digit major; a missing pattern degrades to the daily cron, which
      # is the pre-existing behaviour and not a regression.
      - "v[0-9]"
      - "v[0-9][0-9]"
  workflow_run:
    # The automated release path — see the header. `release.yml` pushes the
    # alias with GITHUB_TOKEN, which by design starts no workflow runs, so the
    # tag filter above cannot see it and this is the only trigger that can.
    #
    # The name is matched as a literal string against `release.yml`'s `name:`.
    # Renaming that workflow would silently stop this trigger firing, so a
    # test asserts the two strings are equal.
    workflows: ["Release (move major alias tag)"]
    types: [completed]
  schedule:
    # Daily. The backstop, not the primary signal: it catches an alias moved
    # by some path neither trigger above covers, and it re-states a drift that
    # has gone unaddressed for a day.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # DELIBERATELY NOT KEYED ON `github.ref` — it was, until the triggers above
  # made that unsafe.
  #
  # Every run of this workflow answers one global question: does
  # `v1^{commit}` equal `origin/main`? Nothing about that question is
  # parameterised by the ref a run happens to be attached to. Both jobs
  # re-fetch `origin/main` and re-read the real tag, and `tagctl.sh pins`
  # reads the workflow files out of `origin/main` with `git ls-tree`/`git
  # show` rather than out of the checkout, so a run's answer does not depend
  # on its own checkout either.
  #
  # That makes superseding always safe: the newer run's answer is at least as
  # current as the one it cancels, and after a release the newer one is the
  # only one that is right. Keying on the ref would NOT have been safe, since
  # the new tag-push runs carry `refs/tags/v1` and would land in their own
  # bucket — free to run CONCURRENTLY with a scheduled run on
  # `refs/heads/main`. Both would find no open tracking issue, both would `gh
  # issue create`, and the result is two issues sharing the single fixed title
  # that is the entire dedupe key — of which the close path only ever closes
  # one, leaving a permanent false alarm. Superseding a stale run is what we
  # want; racing one is not.
  group: vigil-tag-drift
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Surface 1: the consumer-facing alias. This is the one that decides whether
  # merged fixes are actually running in the fleet, and it must be able to go
  # green — see defect 2 in the header.
  # ==========================================================================
  alias:
    name: v1 alias vs main
    runs-on: ${{ fromJSON(vars.VIGIL_RUNNER_JSON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      # For the tracking issue. This job cannot write code or tags; the only
      # mutation it is capable of is opening, editing and closing one issue.
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history are both required: without them the alias
          # cannot be peeled and the commit counts are meaningless.
          #
          # On a `push` to a TAG ref this checks out the tag, not `main`, and
          # the workflow definition used is the one at that commit. That is
          # fine here, and was checked rather than assumed: the only file this
          # job executes out of the checkout is `.github/scripts/tagctl.sh`,
          # which is present at any commit the alias can legally point at
          # (`plan-move` refuses a target not contained in `main`); the step
          # below fetches `origin/main` and the tags explicitly instead of
          # trusting checkout's refspec; and every comparison downstream is
          # expressed against `origin/main` and the real `v1`, never against
          # `HEAD`. The answer is therefore identical from either checkout.
          fetch-depth: 0

      - name: Ensure main and tags are present
        # A missing tag would read as "alias missing" and a missing
        # `origin/main` as an unresolvable branch — both are reported, but
        # fetching explicitly keeps the check measuring drift rather than
        # measuring its own checkout.
        run: |
          set -euo pipefail
          git fetch --force --tags origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify 'origin/main^{commit}' >/dev/null

      - name: Check the v1 alias against main
        id: alias
        # NOT the default shell: this step handles a non-zero exit itself, and
        # the default `-e` would abort it before it could report. See defect 1.
        shell: bash {0}
        run: |
          set -uo pipefail

          rc=0
          out="$(bash .github/scripts/tagctl.sh drift --alias v1 --branch origin/main)" || rc=$?
          printf '%s\n' "$out"

          # `tagctl.sh drift` peels the alias for us — `resolve()` applies
          # `^{commit}`, so this is the dereferenced comparison and not the
          # `git rev-parse v1` form that reports phantom drift against an
          # annotated tag. `v1` is lightweight today and was annotated as
          # recently as 2026-08-28, so the peel has to stay unconditional.
          count="$(printf '%s\n' "$out" | sed -n 's/^drift_count=//p')"
          unshipped="$(printf '%s\n' "$out" \
            | sed -n '/^unshipped<<EOF_UNSHIPPED$/,/^EOF_UNSHIPPED$/p' | sed '1d;$d')"

          {
            echo "## Release pin drift"
            echo ""
            echo "### \`v1\` alias"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -eq 0 ]; then
            echo "\`v1\` is in sync with \`main\`." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -eq 4 ]; then
            echo "::error::the v1 alias tag does not exist"
            echo "\`v1\` is **missing**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::v1 is ${count} commit(s) behind main — merged fixes are not reaching consumers"
            {
              echo "\`v1\` is **${count} commit(s) behind \`main\`**. Every consumer"
              echo "pinning \`F2iLLC/vigil@v1\` is running without these:"
              echo ""
              echo '```'
              printf '%s\n' "$unshipped"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "rc=$rc"
            echo "count=${count:-0}"
          } >> "$GITHUB_OUTPUT"

          # Hand the commit list to the tracking step as a file. A multiline
          # step output would have to be delimiter-escaped, and a commit
          # subject containing the delimiter would corrupt the run.
          printf '%s\n' "$unshipped" > unshipped.txt

      - name: Track the drift in the issue tracker
        id: track
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC: ${{ steps.alias.outputs.rc }}
          COUNT: ${{ steps.alias.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          # One fixed title is the whole dedupe key. Searching by body marker
          # would depend on GitHub's search index, which lags by minutes and
          # would let a scheduled run open a second copy.
          TITLE="Release drift: the v1 alias is behind main"

          existing="$(gh issue list --state open --limit 200 \
                        --json number,title --jq '.[] | [.number, .title] | @tsv' \
                      | awk -F'\t' -v t="$TITLE" '$2 == t { print $1; exit }')"

          if [ "$RC" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body \
                "\`v1\` is back in sync with \`main\`. Closing automatically — [run](${RUN_URL})."
              gh issue close "$existing"
              echo "closed #$existing"
            else
              echo "in sync, nothing tracked"
            fi
            exit 0
          fi

          {
            echo "\`v1\` is what every consumer pins (\`uses: F2iLLC/vigil@v1\`), so"
            echo "**merging is not shipping**. It is currently **${COUNT} commit(s) behind**"
            echo "\`main\`, which means these merged fixes are not running anywhere in"
            echo "the fleet:"
            echo ""
            echo '```'
            cat unshipped.txt
            echo '```'
            echo ""
            echo "This is the failure mode issue #82 records: the defects above are"
            echo "**closed on the tracker while still live in every repo**, so asking"
            echo "\"is it fixed?\" gives the wrong answer. This issue exists so that"
            echo "gap is visible where people actually look."
            echo ""
            echo "### To clear it"
            echo ""
            echo "Moving \`v1\` is a fleet-wide release and belongs to the repository"
            echo "owner — no automation here will do it. Run the **Release (move major"
            echo "alias tag)** workflow (or push a \`vX.Y.Z\` tag) and approve the"
            echo "\`release\` deployment."
            echo ""
            echo "### To verify by hand"
            echo ""
            echo "Dereference, always — against an annotated \`v1\` the undereferenced"
            echo "form reports drift unconditionally and is a permanent false alarm:"
            echo ""
            echo '```bash'
            echo "[ \"\$(git rev-parse 'v1^{commit}')\" = \"\$(git rev-parse origin/main)\" ] \\"
            echo "  && echo 'v1 is current' || echo 'v1 BEHIND main'"
            echo '```'
            echo ""
            echo "---"
            echo "_Opened and maintained automatically by \`.github/workflows/tag-drift-check.yml\`._"
            echo "_It closes itself once the alias catches up. Last checked: [run](${RUN_URL})._"
          } > issue-body.md

          if [ -n "$existing" ]; then
            # Edit rather than comment: a daily comment on a week-long drift is
            # noise, and the body should always show the CURRENT gap.
            gh issue edit "$existing" --body-file issue-body.md
            echo "refreshed #$existing"
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi

      - name: Fail if the alias has drifted
        if: steps.alias.outputs.rc != '0'
        run: |
          echo "::error::v1 is not in sync with main — see the job summary"
          exit 1

  # ==========================================================================
  # Surface 2: the in-repo self-pins. Separate job on purpose — this one is
  # expected to be red between bumps, and must not be able to mask surface 1.
  # ==========================================================================
  pins:
    name: self-pins vs main
    runs-on: ${{ fromJSON(vars.VIGIL_RUNNER_JSON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure main and tags are present
        run: |
          set -euo pipefail
          git fetch --force --tags origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify 'origin/main^{commit}' >/dev/null

      - name: Check the in-repo self-pins against main
        id: pins
        shell: bash {0}
        run: |
          set -uo pipefail

          rc=0
          out="$(bash .github/scripts/tagctl.sh pins --branch origin/main)" || rc=$?
          printf '%s\n' "$out"

          {
            echo "## \`F2iLLC/vigil@<sha>\` self-pins"
            echo ""
            echo "**This surface is report-only — it cannot fail the run (#89).**"
            echo "A self-pin written as a commit SHA is unsatisfiable by construction:"
            echo "writing the new SHA into a workflow file is itself a commit on"
            echo "\`main\`, so the pin is \`behind:1\` the instant it is bumped. (A pin"
            echo "written as \`@v1\` tracks the alias and can be current — that is one"
            echo "of the options #88 is deciding.) The gating surface is the"
            echo "\`v1 alias vs main\` job."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -eq 0 ]; then
            echo "All self-pins are current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::stale F2iLLC/vigil self-pins in .github/workflows/"
            {
              echo "Stale pins found. These do **not** follow the \`v1\` alias, so"
              echo "releasing \`v1\` does not refresh them:"
              echo ""
              echo '| file | pin | state |'
              echo '|---|---|---|'
              printf '%s\n' "$out" | awk -F'\t' '$1=="pin"{printf "| `%s` | `%s` | %s |\n", $2, $3, $4}'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # REPORT ONLY, deliberately. See defect 3 in the header: while the
      # self-pins are commit SHAs this gate cannot be satisfied, so failing on
      # it only taught people to ignore the run. The annotation and the pin
      # table above carry the whole signal; `v1 alias vs main` does the gating.
      - name: Report stale self-pins (report-only — never fails)
        id: report
        if: steps.pins.outputs.rc != '0'
        run: |
          echo "::warning::stale self-pins (report-only, see the job summary) — the gating surface is the v1 alias job"
